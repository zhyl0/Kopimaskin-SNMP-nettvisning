<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lag admin/config.php</title>
<style>
body{font-family:system-ui,sans-serif;max-width:800px;margin:40px auto;padding:0 18px;line-height:1.5}label{display:block;margin:12px 0;font-weight:650}input,textarea{width:100%;box-sizing:border-box;padding:9px;font:inherit}textarea{height:280px;font-family:ui-monospace,monospace;font-size:.85rem}button{padding:10px 14px;font:inherit;font-weight:700}code{background:#eee;padding:2px 5px;border-radius:4px}.note{background:#eef6ff;padding:10px;border-radius:8px}
</style>
</head>
<body>
<h1>Lag <code>admin/config.php</code></h1>
<p class="note">Alt skjer lokalt i nettleseren med Web Crypto. Passordet sendes ingen steder.</p>
<label>Admin-brukernavn <input id="username" value="admin" autocomplete="off"></label>
<label>Passord <input id="password" type="password" autocomplete="new-password"></label>
<button id="generate">Generer config.php</button>
<h2>Resultat</h2>
<textarea id="output" readonly placeholder="Resultatet kommer her"></textarea>
<script>
const b64 = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes)));
const esc = value => String(value).replaceAll('\\','\\\\').replaceAll("'","\\'");
document.getElementById('generate').addEventListener('click', async () => {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || password.length < 14) {
    alert('Bruk et brukernavn og et passord på minst 14 tegn.'); return;
  }
  const iterations = 600000;
  const salt = crypto.getRandomValues(new Uint8Array(24));
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations,hash:'SHA-256'}, key, 256);
  const text = `<?php\ndeclare(strict_types=1);\n\nreturn [\n    'username' => '${esc(username)}',\n    'password' => [\n        'iterations' => ${iterations},\n        'salt' => '${b64(salt)}',\n        'hash' => '${b64(bits)}',\n    ],\n    'session_name' => 'kopistatus_admin',\n    'session_timeout_minutes' => 480,\n    'max_failures' => 5,\n    'failure_window_minutes' => 15,\n    'block_minutes' => 15,\n];\n`;
  document.getElementById('output').value = text;
});
</script>
</body>
</html>
